name: defensive-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[ml,dev,security]"
      - name: Static quality gates
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m bandit -q -r app ml scripts -x tests
      - name: Test with branch coverage
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Dependency audit
        run: python -m pip_audit . --progress-spinner off
      - name: Verify packaged artifact
        run: python scripts/validate_artifact.py
