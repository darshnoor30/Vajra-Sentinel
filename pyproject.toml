[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vajra-sentinel"
version = "1.0.1"
description = "Evidence-first hybrid network IDS/IPS with Suricata, behavioral analytics, safe containment, and an optional ML layer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Darshnoor Kaur"}]
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
ml = [
  "joblib>=1.4,<2.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  # joblib model artifacts are only supported with their training version.
  "scikit-learn==1.9.0",
]
dev = [
  "httpx2>=2.12,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.12,<1.0",
]
security = [
  "bandit>=1.8,<2.0",
  "pip-audit>=2.9,<3.0",
]

[project.scripts]
vajra-sentinel = "app.main:run"
vajra-train = "ml.train:main"
vajra-demo-data = "ml.generate_demo_dataset:main"

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.setuptools.package-data]
app = ["web/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]
"ml/generate_demo_dataset.py" = ["S311"]
